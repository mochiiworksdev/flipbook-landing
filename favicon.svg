<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5C3A21"/>
      <stop offset="100%" stop-color="#432A18"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF7EC"/>
      <stop offset="100%" stop-color="#EDE3CC"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C46A"/>
      <stop offset="100%" stop-color="#B8862A"/>
    </linearGradient>
  </defs>

  <!-- Back cover -->
  <rect x="6" y="10" width="52" height="44" rx="4" fill="url(#cover)"/>
  <rect x="6" y="10" width="52" height="44" rx="4" fill="none" stroke="#B8892B" stroke-width="1" opacity="0.4"/>

  <!-- Left page -->
  <path d="M 10 14 L 32 14 L 32 50 L 10 50 Z" fill="url(#page)" stroke="#C9BFA8" stroke-width="0.6"/>

  <!-- Right page -->
  <path d="M 32 14 L 54 14 L 54 50 L 32 50 Z" fill="url(#page)" stroke="#C9BFA8" stroke-width="0.6"/>

  <!-- Center fold -->
  <line x1="32" y1="14" x2="32" y2="50" stroke="#C9BFA8" stroke-width="0.8"/>

  <!-- Ruled lines on pages -->
  <g stroke="#C9BFA8" stroke-width="0.5" opacity="0.7">
    <line x1="14" y1="22" x2="28" y2="22"/>
    <line x1="14" y1="28" x2="28" y2="28"/>
    <line x1="14" y1="34" x2="28" y2="34"/>
    <line x1="14" y1="40" x2="28" y2="40"/>
    <line x1="36" y1="22" x2="50" y2="22"/>
    <line x1="36" y1="28" x2="50" y2="28"/>
    <line x1="36" y1="34" x2="50" y2="34"/>
    <line x1="36" y1="40" x2="50" y2="40"/>
  </g>

  <!-- Gold ribbon bookmark -->
  <path d="M 32 12 L 38 12 L 38 30 L 35 27 L 32 30 Z" fill="url(#ribbon)" stroke="#8A6618" stroke-width="0.5"/>
</svg>